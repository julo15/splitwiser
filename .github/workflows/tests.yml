name: Tests

# Pushes to main are covered by deploy.yml, which runs the same suites as a
# gate before shipping — running them here too would just duplicate the work.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml
